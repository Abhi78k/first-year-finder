<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Year Finder — Student Location Tracker</title>
    <meta name="description" content="Track first-year B.E/B.Tech students across campus blocks and rooms by department, date, and custom time slots.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo-section">
                    <div class="logo-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                        </svg>
                    </div>
                    <div>
                        <h1 class="app-title">First Year Finder</h1>
                        <p class="app-subtitle">1st Semester Student Location Tracker</p>
                    </div>
                </div>
                <div class="header-stats" id="headerStats">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </header>

        <!-- Filters Section -->
        <section class="filters-section">
            <div class="filters-container">
                <div class="filters-grid">
                    <!-- Date Filter -->
                    <div class="filter-group">
                        <label class="filter-label" for="dateFilter">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                            Date
                        </label>
                        <select id="dateFilter" class="filter-control">
                            <option value="">All Dates</option>
                        </select>
                    </div>

                    <!-- Custom Time Slot Filter -->
                    <div class="filter-group filter-group-time">
                        <label class="filter-label" for="customTimeInput">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                            Time Slot (Custom Range, e.g. 10-12)
                        </label>
                        <div class="time-input-row">
                            <input 
                                type="text" 
                                id="customTimeInput" 
                                class="filter-control time-text-input" 
                                placeholder="Type slot (e.g. 10-12, 8:25-9:50)"
                            />
                            <div class="time-range-picker">
                                <input type="time" id="timeFrom" class="filter-control time-pick" title="From Time" aria-label="From Time" />
                                <span class="time-separator">to</span>
                                <input type="time" id="timeTo" class="filter-control time-pick" title="To Time" aria-label="To Time" />
                            </div>
                        </div>
                    </div>

                    <!-- Department Filter -->
                    <div class="filter-group">
                        <label class="filter-label" for="deptFilter">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                            Department
                        </label>
                        <select id="deptFilter" class="filter-control">
                            <option value="">All Departments</option>
                        </select>
                    </div>

                    <!-- Block Filter -->
                    <div class="filter-group">
                        <label class="filter-label" for="blockFilter">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><line x1="9" y1="22" x2="9" y2="22.01"/><line x1="15" y1="22" x2="15" y2="22.01"/><line x1="9" y1="6" x2="9" y2="6.01"/><line x1="15" y1="6" x2="15" y2="6.01"/><line x1="9" y1="10" x2="9" y2="10.01"/><line x1="15" y1="10" x2="15" y2="10.01"/><line x1="9" y1="14" x2="9" y2="14.01"/><line x1="15" y1="14" x2="15" y2="14.01"/><line x1="9" y1="18" x2="9" y2="18.01"/><line x1="15" y1="18" x2="15" y2="18.01"/></svg>
                            Block
                        </label>
                        <select id="blockFilter" class="filter-control">
                            <option value="">All Blocks</option>
                        </select>
                    </div>

                    <!-- Reset Button -->
                    <div class="filter-group filter-group-actions">
                        <label class="filter-label">&nbsp;</label>
                        <button id="resetBtn" class="reset-button" type="button" title="Clear all filters">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                            Reset
                        </button>
                    </div>
                </div>

                <!-- Quick Preset Chips -->
                <div class="time-presets">
                    <span class="presets-title">Quick Time Slots:</span>
                    <button type="button" class="preset-chip active" data-slot="all">All Times</button>
                    <button type="button" class="preset-chip" data-slot="08:00-10:00">8:00 - 10:00</button>
                    <button type="button" class="preset-chip" data-slot="10:00-12:00">10:00 - 12:00</button>
                    <button type="button" class="preset-chip" data-slot="12:00-14:00">12:00 - 2:00</button>
                    <button type="button" class="preset-chip" data-slot="14:00-16:00">2:00 - 4:00</button>
                    <button type="button" class="preset-chip" data-slot="16:00-17:00">4:00 - 5:00</button>
                </div>
            </div>
        </section>

        <!-- Summary Metric Cards -->
        <section class="summary-section" id="summarySection">
            <!-- Populated dynamically -->
        </section>

        <!-- Main Content -->
        <main class="main-content" id="mainContent">
            <!-- Loading -->
            <div class="loading-state" id="loadingState">
                <div class="spinner"></div>
                <p>Loading first semester timetable data...</p>
            </div>

            <!-- Empty State -->
            <div class="empty-state hidden" id="emptyState">
                <div class="empty-icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                </div>
                <h3>No classes found</h3>
                <p>No 1st sem classes match the selected date, time slot, department, or block.</p>
                <button type="button" class="empty-reset-btn" onclick="document.getElementById('resetBtn').click()">Clear Filters</button>
            </div>

            <!-- Results Hierarchy: Department -> Block -> Room -->
            <div class="results-container hidden" id="resultsContainer">
                <!-- Populated dynamically -->
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>First Year Finder &bull; B.E/B.Tech 1st Semester Block &amp; Room Tracker</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
